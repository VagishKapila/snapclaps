name: Real User Test
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  real-user-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium
      - run: npm run test:real-user:production
        env:
          ENV: production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/real-user/screenshots/
